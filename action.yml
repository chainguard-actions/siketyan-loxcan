name: 'Loxcan'
author: 'Naoki Ikeguchi'
description: 'Universal Lock File Scanner for Git.'
branding:
  icon: 'search'
  color: 'yellow'
inputs:
  report_enabled:
    required: true
    description: 'Reports to GitHub pull request only if this input is "true".'
    default: '${{ github.event.repository.owner.id == github.event.pull_request.head.user.id }}'
  owner:
    required: true
    description: 'The owner (organization) of the repository.'
    default: ${{ github.event.repository.owner.login }}
  repo:
    required: true
    description: 'The name of the repository.'
    default: ${{ github.event.repository.name }}
  base:
    required: true
    description: 'The base branch of the pull request.'
    default: ${{ github.event.pull_request.base.ref }}
  issue_number:
    required: true
    description: 'The number of a issue or pull request to add a comment.'
    default: ${{ github.event.pull_request.number }}
  token:
    required: true
    description: 'An OAuth token to access to the repository as a bot.'
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT_REPORT_ENABLED: ${{ inputs.report_enabled }}
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_BASE: ${{ inputs.base }}
        GITHUB_SHA_VALUE: ${{ github.sha }}
      run: |
        pushd "$ACTION_PATH" && composer i -n && popd

        if [ "$INPUT_REPORT_ENABLED" = "true" ]; then
          export LOXCAN_REPORTER_GITHUB="1"
          export LOXCAN_REPORTER_GITHUB_OWNER="$INPUT_OWNER"
          export LOXCAN_REPORTER_GITHUB_REPO="$INPUT_REPO"
          export LOXCAN_REPORTER_GITHUB_ISSUE_NUMBER="$INPUT_ISSUE_NUMBER"
          export LOXCAN_REPORTER_GITHUB_TOKEN="$INPUT_TOKEN"
          export LOXCAN_REPORTER_GITHUB_USERNAME="github-actions[bot]"
        fi

        BRANCH_BASE="origin/$INPUT_BASE"
        BRANCH_HEAD="$GITHUB_SHA_VALUE"

        "$ACTION_PATH/bin/loxcan" "${BRANCH_BASE}" "${BRANCH_HEAD}"
