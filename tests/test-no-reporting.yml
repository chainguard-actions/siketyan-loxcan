name: Test scan with report_enabled false (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: act-harness
      GITHUB_BASE_REF: act-harness
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install PHP and Composer if not available
        run: |
          php --version || (apt-get update -qq && apt-get install -y -qq php-cli php-zip php-json)
          composer --version || (curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer)

      - name: Set up git origin pointing to local workspace
        run: |
          git remote set-url origin "$GITHUB_WORKSPACE"
          git branch -f act-harness HEAD 2>/dev/null || true
          git fetch origin act-harness
          echo "Remote branches:"
          git branch -r

      - id: action
        uses: .
        with:
          report_enabled: "false"
          owner: test-owner
          repo: test-repo
          base: act-harness
          issue_number: "1"
          token: fake-token-not-used

      - name: Assert action succeeded without GitHub API calls
        run: |
          echo "PASS: loxcan ran successfully with report_enabled=false"
          echo "No GitHub API token was needed since reporting was disabled"
