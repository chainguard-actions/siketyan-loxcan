name: Test scan with reporting disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install PHP and Composer
        run: |
          php --version || (apt-get update -qq && apt-get install -y -qq php-cli php-json php-mbstring php-xml php-curl php-zip)
          composer --version || (curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer)

      - name: Set up git remote ref so origin/act-harness exists
        run: |
          git config user.email "test@example.com"
          git config user.name "Test"
          # Create a remote tracking ref pointing to current HEAD (no diff = no changes)
          HEAD_SHA=$(git rev-parse HEAD)
          echo "HEAD SHA: $HEAD_SHA"
          git update-ref refs/remotes/origin/act-harness "$HEAD_SHA"
          echo "Created refs/remotes/origin/act-harness -> $HEAD_SHA"
          git branch -r

      - id: action
        uses: .
        with:
          report_enabled: 'false'
          owner: 'example-org'
          repo: 'example-repo'
          base: 'act-harness'
          issue_number: '42'
          token: 'not-used-because-reporting-disabled'
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Assert no-report scan completed
        run: |
          echo "Scan completed in no-report mode (report_enabled=false)"
          echo "No GitHub reporter was invoked - no token needed"
          echo "PASS"
