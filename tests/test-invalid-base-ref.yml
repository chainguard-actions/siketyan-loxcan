name: Test invalid base ref handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install PHP and Composer
        run: |
          which php || (apt-get update -qq && apt-get install -y -qq php-cli php-json php-mbstring php-xml php-curl)
          which composer || (curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer)

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a bare repo under GITHUB_WORKSPACE so it's reachable
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          report_enabled: 'false'
          owner: 'test-owner'
          repo: 'test-repo'
          base: 'nonexistent-branch-xyz-12345'
          issue_number: '1'
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action fails gracefully with invalid base ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When the base ref doesn't exist, loxcan should fail
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid base ref"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (loxcan may treat missing base as no changes)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
